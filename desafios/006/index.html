<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Tags HTML</title>
</head>
<body>
   <h1>Tags em HTML</h1> 
   <p>Em HTML5, podemos inserir os elementos da lista a seguir.Passe o cursor do mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
   <ul>
    <li title="Use a tag <p>">Parágrafos</li>
    <li title="Use a tag <h1>">Titulos</li>
    <li title="Use a tag <img>">Imagens</li>
    <li title="Use a tag <abbr>">Abreviações</li>
    <li title="Use a tag <code>">Codigo-fonte</li>
    <li title="Use a tag <ol>">Listas ordenadas</li>
    <li title="Use a tag ul">Listas com demarcadores</li>        
   </ul>
    
  
</body>
</html>
