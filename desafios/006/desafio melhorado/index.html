<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags</title>
</head>
<body>
    <style>
    body {
     font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2c2c54);
      color: white;
      text-align: center;
      padding: 40px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2.5em;
    }

    p {
      margin-bottom: 30px;
      color: #ccc;
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 400px;
      margin: auto;
    }

    li {
      background: #3a3a6a;
      margin: 10px 0;
      padding: 15px;
      border-radius: 12px;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    li:hover {
      background: #5757a5;
      transform: scale(1.05);
    }

    /* Tooltip personalizado */
    li::after {
      content: attr(title);
      position: absolute;
      left: 50%;
      bottom: 110%;
      transform: translateX(-50%);
      background: #000;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    li:hover::after {
      opacity: 1;
    }
  </style>
</head>

<body>

  <h1>🏷️ Tags em HTML</h1>
  <p>Passe o mouse sobre os itens para descobrir qual tag usar</p>

  <ul>
    <li title="Use a tag <p>">Parágrafos</li>
    <li title="Use as tags <h1> até <h6>">Títulos</li>
    <li title="Use a tag <img>">Imagens</li>
    <li title="Use a tag <abbr>">Abreviações</li>
    <li title="Use a tag <code>">Códigos-fonte</li>
    <li title="Use a tag <ol>">Listas numeradas</li>
    <li title="Use a tag <ul>">Listas com marcadores</li>
    <li title="Use a tag <a>">Links</li>
    <li title="Use a tag <video>">Vídeos</li>
  </ul>

</body>
</html>
