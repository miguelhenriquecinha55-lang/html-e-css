<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="html.ico" type="image/x-icon">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family:'texas' ;
            src: url('fontes/Texas.otf') format('Opentype');
            /*
                Opentype=(otf)
                truetype=(ttf)

            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif, Helvetica, sans-serif;
        }
        h1 {
            font-family:  'texas', Helvetica, sans-serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>
        Titulo
    </h1>
</body>
</html>
