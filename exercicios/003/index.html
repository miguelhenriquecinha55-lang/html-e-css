<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com Imagens</title>
</head>
<body>
    <h1>Testando carga de Imagens</h1>

    <p>Abaixo você vai ver uma imagem que esta na mesma pasta.</p>
    <img src="logo html200.png" alt="logo HTML 5"> 
    <!--depois de digitar img aperta ctrl+espaço e seleciona a img-->

    <p>Podemos tambem carregar imagens que estao em sub-pastas</p>
    <img src="imagens/logo css200.png" alt="logo CSS3">

    <p>Tambem podemos carregar imagens externas.</p>
    <img src="https://freesvg.org/img/js_logo.png" alt="logo JavaScript">
    <!--Essa imagem já é de um servidor da internet, em src cola o endereço da imagem\URL-->
</body>
</html>
