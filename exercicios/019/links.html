<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: rgba(0, 0, 163, 0.908);
        }
        a:active {
            text-decoration: underline;
        }
        a:visited {
            color: rgb(0, 0, 23);
            font-weight: bold;
            text-decoration: none;
        }
        a:hover {
            background-color: grey;
        }
        .youtube::after {
                content: ' <';
        }
        .youtube::before {
            content: ' > ';
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositorio GitHub</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" target="_blank" class="youtube">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank" >Site do Cursoemvideo</a></li>

    </ul>
</body>
</html>
