<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo classes</title>
    <style>
        h1 {
            font-family: Arial, Helvetica, sans-serif;
        }
        div:hover {
            color: rgb(217, 93, 93);
        }
        div > p {
            display: none;
            

        }
        div:hover > p {
            display: block;
            background-color: rgb(159, 19, 19);
            color: white;
        }
        
    </style>

</head>
<body>
    <h1>Teste de hover</h1>
    <h2>Começando</h2>
    <div>
        passe o mouse aqui
        <p>
           texto escondido
        </p>
    </div>
</body>
</html>
