<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping Tags</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: dimgray;
        }
        header {
            background-color: white;
            padding: auto;

        }
        nav > a:hover {
            text-decoration: overline;
        }
        nav {
            background-color: white;
            padding: 6px;
            font-size: 0,6em;
            box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.353);

        }
        main {
            background-color: white;
            padding: 10px;
            margin: 10px;
            border-radius: 10px 20px;
            box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.453);
        }
        p {
            background-color: white;
            padding: 8px;
            text-align: justify;
        }
        aside {
            background-color: white;
            padding: 5px;
            text-align: left;
        }
        footer {
            text-decoration: underline;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0,8em;
            padding: 1px ;
            text-align: center;
            background-color: black;
            color: beige;
            border: 2px;
            
        }

        footer > p {
            margin: 0xp;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu site</h1>
        <nav>
            <a href="1" target="_blank">11</a>
            <a href="2" target="_blank">12</a>
        </nav>
    </header>
    <main>
        <section>
            <article>
                <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ab voluptate repellat dolorem harum asperiores blanditiis porro officiis reiciendis explicabo non odio natus tempore et modi facilis quaerat mollitia, molestiae rem.</p>
                <aside>
                    Lorem
                </aside>
            </article>
        </section>
    </main>
    <footer>
        <br>
        <br>
        des. Coreano 
    </footer>
</body>
</html>
